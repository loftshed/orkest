name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a default-branch run: it may be publishing a release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release preview needs every commit and release tag.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - run: rustup update stable && rustup component add rustfmt clippy
      - run: npm install --global corepack@0.36.0
      - run: corepack pnpm install --frozen-lockfile
      # Lets the gate run `claude plugin validate`, which works offline.
      - run: npm install -g @anthropic-ai/claude-code
      - run: ./scripts/check.sh
      # Builds the pending release in a scratch worktree and runs the gate on it.
      - run: node scripts/release.js check

  test:
    # The plugins target macOS (menu bar app, Mac-to-Mac migration).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
      - run: rustup update stable
      - run: npm install --global corepack@0.36.0
      - run: corepack pnpm install --frozen-lockfile
      - run: ./scripts/test.sh
        env:
          CI: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: junit
          path: junit.xml
          retention-days: 1

  release:
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      orchestrate_release_tag: ${{ steps.publish.outputs.orchestrate_release_tag }}
    concurrency:
      group: plugin-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # scripts/release.js authenticates its own push.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - run: npm install --global corepack@0.36.0
      - run: corepack pnpm install --frozen-lockfile
      - run: npm install -g @anthropic-ai/claude-code
      - id: publish
        run: node scripts/release.js publish
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ github.token }}
          # Optional: a token that may push past branch protection on main.
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  release-ork-fast:
    needs: [release]
    if: needs.release.outputs.orchestrate_release_tag != ''
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.orchestrate_release_tag }}
      - run: rustup update stable && rustup target add ${{ matrix.target }}
      - name: Install cross-compilation toolchain on Linux for aarch64
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build release binary
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          fi
          cargo build --manifest-path crates/ork-fast/Cargo.toml --release --target ${{ matrix.target }}
          cp crates/ork-fast/target/${{ matrix.target }}/release/ork-fast ork-fast-${{ matrix.target }}
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            codesign --force --sign - ork-fast-${{ matrix.target }}
          fi
      - name: Upload binary asset
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          TAG: ${{ needs.release.outputs.orchestrate_release_tag }}
        run: |
          gh release upload "$TAG" ork-fast-${{ matrix.target }} --clobber

  release-ork-fast-sums:
    needs: [release, release-ork-fast]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate and upload SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          TAG: ${{ needs.release.outputs.orchestrate_release_tag }}
        run: |
          mkdir -p assets
          cd assets
          gh release download "$TAG" -p "ork-fast-*"
          sha256sum ork-fast-* > SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber
