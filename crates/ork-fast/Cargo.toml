[package]
name = "ork-fast"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
libc = "0.2.191"
rusqlite = { version = "0.43.0", features = ["bundled", "functions"] }
serde_json = "1.0.154"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
