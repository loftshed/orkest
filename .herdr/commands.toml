# Orkest Command Palette & Shortcuts for Herdr

[[commands]]
id = "orkest.toggle-horde-view"
title = "Toggle Horde View"
description = "Open or close the live Orkest Horde View split pane in the current terminal"
command = "ork horde toggle"
type = "shell"
key = "prefix+alt+h"
width = "40%"
height = "100%"

[[commands]]
id = "orkest.quota-radar"
title = "Quota Radar"
description = "Inspect subscription quota pools, model release radar, and 14-day rolling telemetry"
command = "ork radar"
type = "popup"
key = "prefix+alt+r"
width = "85%"
height = "80%"

[[commands]]
id = "orkest.smelter-audit"
title = "Smelter Audit"
description = "Run the 4-stage worktree verification, cold-review, and merge queue audit"
command = "ork smelter status"
type = "popup"
key = "prefix+alt+s"
width = "85%"
height = "80%"

[[commands]]
id = "orkest.foundry-status"
title = "Foundry Status"
description = "Show spare-token issue harvester status, active worktree dispatches, and evaluation gates"
command = "ork foundry status"
type = "popup"
key = "prefix+alt+f"
width = "85%"
height = "80%"

[[commands]]
id = "orkest.next-step"
title = "Next Step"
description = "Determine and execute the next safe autonomous step across worktrees, Smelter, and Foundry"
command = "ork next"
type = "popup"
key = "prefix+alt+n"
width = "85%"
height = "80%"

[[commands]]
id = "orkest.side-mission"
title = "Side Mission"
description = "Inspect or launch background side-mission worktrees on spare subscription quota"
command = "ork side status"
type = "popup"
key = "prefix+alt+m"
width = "85%"
height = "80%"

[[commands]]
id = "orkest.cleanup-state"
title = "Cleanup Legacy State"
description = "Audit and prune stale rooms, orphaned worktrees, and legacy runtime caches"
command = "ork cleanup"
type = "popup"
key = "prefix+alt+c"
width = "85%"
height = "80%"

[[commands]]
id = "orkest.policy"
title = "Execution Policy"
description = "View or update harness and pool allow/deny policies for Orkest"
command = "ork policy"
type = "popup"
key = "prefix+alt+p"
width = "85%"
height = "80%"

[[commands]]
id = "orkest.update"
title = "Update Orkest"
description = "Check for and apply Orkest updates"
command = "ork update"
type = "popup"
key = "prefix+alt+u"
width = "85%"
height = "80%"
